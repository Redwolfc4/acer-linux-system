# Acer CLI - Git & GitHub Account Presets
# Copy this file to: ~/.config/acer/accounts.conf
# (or configs/accounts.conf inside the project directory, which is gitignored)
#
# Format:
# alias|github_username|git_author_name|git_author_email
#
# Example:
personal|your-github-username|Your Name|you@example.com
work|your-work-username|Work Name|work@company.com

